[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Old resume link from before the name change
[[redirects]]
  from = "/resume/Abhiraj_Singh_Chatrath_Resume.pdf"
  to = "/resume/Abhiraj_Singh_Resume.pdf"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resume/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"Abhiraj_Singh_Resume.pdf\""
